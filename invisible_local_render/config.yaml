name: Invisible Local Render
version: "0.2.0"
slug: invisible_local_render
description: Serve frames to an Invisible Computers e-paper display from a PNG URL
url: https://github.com/jonathon-m/ha-local-render-server
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
homeassistant_api: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: HTTP port the e-paper display polls for /render and /ack
watchdog: http://[HOST]:[PORT:8080]/health
options:
  url: http://homeassistant:8123/local/display.png
  display: 7_5_inch
  token: ""
schema:
  url: str
  display: list(7_5_inch|10_2_inch)
  token: password?
